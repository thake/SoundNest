# Builds and tests every push / pull request; a "v*" tag publishes signed SoundNest APKs (arm64-v8a, armeabi-v7a)
# as a GitHub release.
name: SoundNest Android CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

defaults:
  run:
    working-directory: base

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6

      # Unit tests across all modules (Android + JVM + KMP).
      # Live browser tests in host-cdp and on-demand DocScreenshotTest skip automatically during CI unit test runs.
      - name: Unit tests
        run: ./gradlew :api:test :api-audible:test :api-spotify:test :automix:test :engine:jvmTest :engine-android:testDebugUnitTest :host-android:testDebugUnitTest :host-cdp:test :app:testDebugUnitTest

      - name: Test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            base/**/build/reports/tests/
            base/**/build/test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v7
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: soundnest-debug
          path: base/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6

      - name: Tag format
        working-directory: .
        run: python3 tools/check_tag.py "$GITHUB_REF_NAME"

      # Two keys, one per channel (they install side by side as two apps):
      # betas ("v1.0.0-beta.1") use SOUNDNEST_KEYSTORE_BASE64, SOUNDNEST_KEYSTORE_PASSWORD,
      # SOUNDNEST_KEY_ALIAS, SOUNDNEST_KEY_PASSWORD; releases use the same names with
      # SOUNDNEST_STABLE_ in front.
      - name: Signing key
        env:
          BETA: ${{ contains(github.ref_name, '-') }}
          BETA_KEYSTORE: ${{ secrets.SOUNDNEST_KEYSTORE_BASE64 }}
          STABLE_KEYSTORE: ${{ secrets.SOUNDNEST_STABLE_KEYSTORE_BASE64 }}
        run: |
          if [ "$BETA" = "true" ]; then KEYSTORE_BASE64="$BETA_KEYSTORE"; NAME=SOUNDNEST_KEYSTORE_BASE64; else KEYSTORE_BASE64="$STABLE_KEYSTORE"; NAME=SOUNDNEST_STABLE_KEYSTORE_BASE64; fi
          test -n "$KEYSTORE_BASE64" || { echo "::error::$NAME secret missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Release APK
        env:
          SOUNDNEST_KEYSTORE: ${{ runner.temp }}/release.jks
          SOUNDNEST_KEYSTORE_PASSWORD: ${{ contains(github.ref_name, '-') && secrets.SOUNDNEST_KEYSTORE_PASSWORD || secrets.SOUNDNEST_STABLE_KEYSTORE_PASSWORD }}
          SOUNDNEST_KEY_ALIAS: ${{ contains(github.ref_name, '-') && secrets.SOUNDNEST_KEY_ALIAS || secrets.SOUNDNEST_STABLE_KEY_ALIAS }}
          SOUNDNEST_KEY_PASSWORD: ${{ contains(github.ref_name, '-') && secrets.SOUNDNEST_KEY_PASSWORD || secrets.SOUNDNEST_STABLE_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Named by :app:collectApks: SoundNest-<version>-ARMv8.apk, -ARMv7.apk, -universal.apk (betas: SoundNest-Beta-...).
          ./gradlew assembleRelease :app:collectApks \
            -PappVersionName="$VERSION" \
            -PappVersionCode="$((1000 + GITHUB_RUN_NUMBER))"

      # This version's section of CHANGELOG.md becomes the release description.
      - name: Release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '$0 == "## " v {f=1; next} /^## / && f {exit} f' ../CHANGELOG.md > release-notes.md
          # A beta without its own section: the CHANGELOG lines added since the previous tag,
          # else (first beta) the section of the version it leads to.
          PREVIOUS="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          if [ ! -s release-notes.md ] && [ "$VERSION" != "${VERSION%%-*}" ] && [ -n "$PREVIOUS" ]; then
            git diff "$PREVIOUS" "$GITHUB_REF_NAME" -- ../CHANGELOG.md | grep '^+- ' | sed 's/^+//' > release-notes.md || true
          fi
          [ -s release-notes.md ] || awk -v v="${VERSION%%-*}" '$0 == "## " v {f=1; next} /^## / && f {exit} f' ../CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "See the commits since the previous release." > release-notes.md
          cat release-notes.md

      - uses: softprops/action-gh-release@v3
        with:
          files: base/app/build/release-apks/*.apk
          body_path: base/release-notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
